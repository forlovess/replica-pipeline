[project]
name = "replica-pipeline"
version = "0.1.0"
description = "Fail-closed production pipeline that forces /replica skill stages before H3 submit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "forlovess" }]

[project.scripts]
replica-pipeline = "replica_pipeline.pipeline:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["replica_pipeline*"]
